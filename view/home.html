<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .home {
            text-align: center;
        }

        h1 {
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 25px;
        }

        button {
            padding: 11px 30px;
            background: white;
            color: black;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #cccccc;
        }
    </style>
</head>
<body>
    <div class="home">
        <h1>Welcome to Home</h1> 
         <a href="/login">Go to Login Page</a>
         <a href="/about">About Us</a>
    </div>

</body>
</html>
