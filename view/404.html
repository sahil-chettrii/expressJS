
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 120px;
            font-weight: 700;
            color: white;
            letter-spacing: 5px;
        }

        h2 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        p {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.3s;
        }

        a:hover {
            background: #ccc;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>Sorry, the page you are looking for doesn't exist.</p>

        <a href="/">Back to Home</a>

    </div>

</body>
</html>
